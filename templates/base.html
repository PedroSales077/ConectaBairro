<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Destino Certo{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">Destino Certo</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="{% url 'inicio' %}">Início</a>
      <a class="nav-link" href="{% url 'nova_ocorrencia' %}">Registrar ocorrência</a>
      <a class="nav-link" href="{% url 'gestao_ocorrencias' %}">Gestão</a>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}" role="status">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="border-top py-3 mt-5">
  <div class="container small text-secondary">Projeto acadêmico Destino Certo — não substitui os canais oficiais de atendimento.</div>
</footer>
</body>
</html>
